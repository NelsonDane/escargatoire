apiVersion: apps/v1
kind: Deployment
metadata:
  name: qui
  namespace: vpn
  annotations:
    ignore-check.kube-linter.io/no-rolling-update-strategy: "Using Recreate strategy to avoid issues with ReadWriteOnce volumes"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qui
    spec:
      restartPolicy: Always
      containers:
        - name: qui
          image: ghcr.io/autobrr/qui:latest@sha256:6ee1cf6df0a82687089e6e181aad09edb826b4b779603c56a28c803d19db99fd
          restartPolicy: Always
          env:
            - name: TZ
              value: "America/New_York"
          ports:
            - name: qui
              containerPort: 7476
              protocol: TCP
          volumeMounts:
            - name: qui-config
              mountPath: /config
            - name: media
              mountPath: /downloads
              subPath: qbittorrent_downloads
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            tcpSocket:
              port: 7476
          readinessProbe:
            tcpSocket:
              port: 7476
      volumes:
        - name: qui-config
          persistentVolumeClaim:
            claimName: qui-config
        - name: media
          nfs:
            server: 10.0.2.20
            path: /Shell/media
