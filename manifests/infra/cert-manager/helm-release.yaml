apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      version: v1.21.3
  values:
    crds:
      enabled: true
    # Force the DNS-01 self-check straight to cloudflare resolvers
    extraArgs:
      - --dns01-recursive-nameservers=1.1.1.1:53
      - --dns01-recursive-nameservers-only=true
    ingressShim:
      defaultIssuerName: letsencrypt-dns
      defaultIssuerKind: ClusterIssuer
