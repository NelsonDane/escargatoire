apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: actual
  namespace: apps
spec:
  serviceName: actual
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: actual
  template:
    metadata:
      labels:
        app: actual
    spec:
      enableServiceLinks: false # https://github.com/actualbudget/actual/issues/4920#issuecomment-2858039347
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      restartPolicy: Always
      containers:
        - name: actual
          image: docker.io/actualbudget/actual-server:latest-alpine@sha256:01ac24a51c6f585aba287c1bf1e96fcda46ab16a05952817c637415213251aa3
          ports:
            - containerPort: 5006
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: actual-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - node
                - src/scripts/health-check.js
          readinessProbe:
            exec:
              command:
                - node
                - src/scripts/health-check.js
        - name: sync
          image: docker.io/seriouslag/actual-auto-sync:latest@sha256:f694b925ba73a094aabfd7e9cd431aec1b93c46207238225cf3ecdba0d02778c
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: actual-auto-sync
          env:
            - name: CRON_SCHEDULE
              value: "0 1 * * *"
            - name: TIMEZONE
              value: "America/New_York"
            - name: LOG_LEVEL
              value: "info"
            - name: RUN_ON_START
              value: "true"
            - name: SKIP_FAILED_ACCOUNTS
              value: "false"
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - process.exit(0)
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - process.exit(0)
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: sync-data
              mountPath: /data
        - name: backup
          image: docker.io/rodriguestiago0/actualbudget-backup:latest@sha256:3426f990964fcc241ae7a49cd6c22f4d18988c13d17214f68dcb28afae09f6cc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: actual-backup
          env:
            - name: ACTUAL_BUDGET_URL
              value: "http://actual:5006"
            - name: CRON
              value: "0 2 * * *"
            - name: TIMEZONE
              value: "America/New_York"
            - name: BACKUP_KEEP_DAYS
              value: "30"
            - name: ZIP_ENABLE
              value: "TRUE"
            - name: RCLONE_CONFIG_ACTUAL-BUDGET-PERSONAL_TYPE
              value: "s3"
            - name: RCLONE_CONFIG_ACTUAL-BUDGET-PERSONAL_PROVIDER
              value: "Cloudflare"
            - name: RCLONE_REMOTE_NAME
              value: "actual-budget-personal"
            - name: RCLONE_REMOTE_DIR
              value: "/actual-backups/"
          livenessProbe:
            exec:
              command:
                - /app/healthcheck.sh
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            exec:
              command:
                - /app/healthcheck.sh
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: backup-config
              mountPath: /config
            - name: backup-tmp
              mountPath: /tmp
      volumes:
        - name: sync-data
          emptyDir: {}
        - name: backup-config
          emptyDir: {}
        - name: backup-tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: actual-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        storageClassName: longhorn
