apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich
  namespace: apps
  labels:
    app: dawarich
  annotations:
    ignore-check.kube-linter.io/no-rolling-update-strategy: "Using Recreate strategy to avoid issues with ReadWriteOnce volumes"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dawarich
  template:
    metadata:
      labels:
        app: dawarich
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Always
      containers:
        - name: dawarich
          image: freikin/dawarich:1.20.1@sha256:0640f5adafd7acfcd8a3c79bb3bd0162d5df9108ebcde8734785f8925d2a01a4
          imagePullPolicy: IfNotPresent
          command: ["web-entrypoint.sh"]
          args: ["bin/rails", "server", "-p", "3000", "-b", "::"]
          env:
            - name: TIME_ZONE
              value: "America/New_York"
            - name: RAILS_ENV
              value: production
            - name: REDIS_URL
              value: "redis://localhost:6379/0"
            - name: DATABASE_HOST
              value: "dawarich-postgres-rw.apps.svc.cluster.local"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: "dawarich"
            - name: APPLICATION_HOST
              value: localhost
            - name: APPLICATION_HOSTS
              value: "locations.cluster.nelsondane.com"
            - name: APPLICATION_PROTOCOL
              value: http
            - name: PHOTON_API_HOST
              value: photon.komoot.io
            - name: PHOTON_API_USE_HTTPS
              value: "true"
            # Since 1.17.0 background jobs (imports, reverse geocoding,
            # stats, visit detection) run embedded in the web process
            # instead of a separate sidekiq container.
            - name: SIDEKIQ_EMBEDDED
              value: "true"
            - name: WEB_CONCURRENCY
              value: "0"
            - name: BACKGROUND_PROCESSING_CONCURRENCY
              value: "2"
          envFrom:
            - secretRef:
                name: dawarich-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: public
              mountPath: /var/app/public
            - name: watched
              mountPath: /var/app/tmp/imports/watched
            - name: storage
              mountPath: /var/app/storage
            - name: app-tmp-web
              mountPath: /var/app/tmp
            - name: tmp-web
              mountPath: /tmp
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
        - name: redis
          image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
          command: ["valkey-server"]
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
      volumes:
        - name: public
          persistentVolumeClaim:
            claimName: dawarich-public
        - name: watched
          persistentVolumeClaim:
            claimName: dawarich-watched
        - name: storage
          persistentVolumeClaim:
            claimName: dawarich-storage
        - name: app-tmp-web
          emptyDir: {}
        - name: tmp-web
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: redis-data
          emptyDir: {}
